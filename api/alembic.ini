[alembic]
# Path to the migration scripts (resolved relative to this file's directory when run from api/).
script_location = migrations
# Make the `app` package importable when running the alembic CLI from api/.
prepend_sys_path = .
path_separator = os
# The database URL comes from app settings (DATABASE_URL), see migrations/env.py.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
