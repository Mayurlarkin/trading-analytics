name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    name: Web (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  stack:
    name: Full stack smoke test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: API can reach the database
        run: curl --fail --silent http://localhost:8000/health/db
      - name: Web is served
        run: curl --fail --silent http://localhost:8080 | grep -q "Trading Analytics"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
