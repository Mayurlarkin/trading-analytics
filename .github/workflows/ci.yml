name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + tests on SQLite and MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: trading_test
          MYSQL_USER: trading
          MYSQL_PASSWORD: trading
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests (SQLite, in memory)
        run: pytest -q
      - name: Tests (real MySQL, schema built by the Alembic migrations)
        run: pytest -q
        env:
          TEST_DATABASE_URL: mysql+pymysql://trading:trading@127.0.0.1:3306/trading_test

  web:
    name: Web (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  stack:
    name: Full stack smoke test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: API can reach the database
        run: curl --fail --silent http://localhost:8000/health/db
      - name: Web is served
        run: curl --fail --silent http://localhost:8080 | grep -q "Trading Analytics"
      - name: Create an account and an API key
        run: |
          KEY=$(docker compose exec -T api python -m app.cli create-account \
            --email ci@example.com --label "CI smoke" --currency ZAR --server-time ny_close \
            --demo --quiet)
          echo "::add-mask::$KEY"
          echo "API_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Ingest rejects a request without a key
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/ingest/trades \
            -H 'Content-Type: application/json' -d @.github/smoke/trades.json)
          test "$status" = "401"
      - name: Ingest creates a trade, and re-sending it changes nothing
        run: |
          send() {
            curl --fail --silent -X POST http://localhost:8000/ingest/trades \
              -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
              -d @.github/smoke/trades.json
          }
          first=$(send); echo "first:  $first"
          echo "$first" | grep -q '"created":1'
          second=$(send); echo "second: $second"
          echo "$second" | grep -q '"unchanged":1'
      - name: Import an MT5 report, then import it again
        run: |
          import_report() {
            curl --fail --silent -X POST http://localhost:8000/import/mt5-report \
              -H "X-API-Key: $API_KEY" -F "file=@api/tests/fixtures/mt5_sample_report.xlsx"
          }
          first=$(import_report); echo "first:  $first"
          echo "$first" | grep -q '"created":8'
          second=$(import_report); echo "second: $second"
          echo "$second" | grep -q '"unchanged":8'
      - name: Log in and read the analytics back through the API
        run: |
          echo "correct-horse-battery" | docker compose exec -T api python -m app.cli set-password \
            --email ci@example.com --password-stdin
          TOKEN=$(curl --fail --silent -X POST http://localhost:8000/auth/login \
            -d "username=ci@example.com" -d "password=correct-horse-battery" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$TOKEN"
          auth="Authorization: Bearer $TOKEN"
          get() { curl --fail --silent -H "$auth" "http://localhost:8000$1"; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/accounts)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/auth/login \
            -d 'username=ci@example.com' -d 'password=wrong-password-123')" = "401"
          account=$(get /accounts | python3 -c "import sys, json; print(json.load(sys.stdin)[0]['id'])")
          summary=$(get "/accounts/$account/summary"); echo "$summary"
          # 1 trade from the ingest step + the 8 sample report positions (report total -944.87,
          # plus the smoke trade's 99.75 profit and -3.50 commission)
          echo "$summary" | grep -q '"trades":9'
          echo "$summary" | grep -q '"net_profit":"-848.62"'
          get "/accounts/$account/equity-curve" | grep -q '"points"'
          get "/accounts/$account/breakdown?by=instrument" | grep -q '"key":"NAS100"'
          get "/accounts/$account/trades?limit=2" | grep -q '"total":9'
      - name: Manage accounts and API keys, and import a report, with a login
        run: |
          TOKEN=$(curl --fail --silent -X POST http://localhost:8000/auth/login \
            -d "username=ci@example.com" -d "password=correct-horse-battery" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$TOKEN"
          auth="Authorization: Bearer $TOKEN"
          json() { python3 -c "import sys, json; print(json.load(sys.stdin)$1)"; }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          api=http://localhost:8000
          # a machine key is not a login
          test "$(code -X POST $api/accounts -H "X-API-Key: $API_KEY" \
            -H 'Content-Type: application/json' -d '{"label":"x"}')" = "401"
          # create a second account and give it its own key
          created=$(curl --fail --silent -X POST $api/accounts -H "$auth" \
            -H 'Content-Type: application/json' \
            -d '{"label":"Created by API","currency":"zar","server_timezone":"ny_close"}')
          echo "$created"
          echo "$created" | grep -q '"currency":"ZAR"'
          account=$(echo "$created" | json "['id']")
          test "$(code -X POST $api/accounts -H "$auth" -H 'Content-Type: application/json' \
            -d '{"label":"created by api"}')" = "409"
          issued=$(curl --fail --silent -X POST $api/accounts/$account/api-keys -H "$auth" \
            -H 'Content-Type: application/json' -d '{"label":"smoke"}')
          NEW_KEY=$(echo "$issued" | json "['key']"); echo "::add-mask::$NEW_KEY"
          key_id=$(echo "$issued" | json "['id']")
          # the new key sends a trade; a login imports the sample report into the same account
          curl --fail --silent -X POST $api/ingest/trades -H "X-API-Key: $NEW_KEY" \
            -H 'Content-Type: application/json' -d @.github/smoke/trades.json | grep -q '"created":1'
          curl --fail --silent -X POST $api/accounts/$account/import/mt5-report -H "$auth" \
            -F "file=@api/tests/fixtures/mt5_sample_report.xlsx" | grep -q '"created":8'
          summary=$(curl --fail --silent -H "$auth" $api/accounts/$account/summary)
          echo "$summary" | grep -q '"trades":9'
          echo "$summary" | grep -q '"net_profit":"-848.62"'
          # the key is listed without its secret, and stops working once revoked
          listing=$(curl --fail --silent -H "$auth" $api/accounts/$account/api-keys); echo "$listing"
          echo "$listing" | grep -q '"label":"smoke"'
          if echo "$listing" | grep -q "$NEW_KEY"; then echo "secret leaked in list"; exit 1; fi
          test "$(code -X DELETE $api/accounts/$account/api-keys/$key_id -H "$auth")" = "204"
          test "$(code -X POST $api/ingest/trades -H "X-API-Key: $NEW_KEY" \
            -H 'Content-Type: application/json' -d @.github/smoke/trades.json)" = "401"
          # the first account's key (from the CLI) is not touched, and ids cannot be probed
          test "$(code -X POST $api/ingest/trades -H "X-API-Key: $API_KEY" \
            -H 'Content-Type: application/json' -d @.github/smoke/trades.json)" = "200"
          test "$(code -H "$auth" $api/accounts/999999/api-keys)" = "404"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
